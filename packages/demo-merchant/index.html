<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme Coffee · Pay with stablecoin</title>
    <style>
      :root {
        --arcora-blue:       #2563ff;
        --arcora-blue-light: #3d7cff;
        --arcora-teal:       #00c2a8;
        --arcora-slate:      #0b1426;
        --arcora-gray:       #e6ecf2;
        --arcora-muted-fg:   #5b6478;
        --arcora-border:     rgba(11, 20, 38, 0.12);
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        background: #fff;
        color: var(--arcora-slate);
        -webkit-font-smoothing: antialiased;
      }
      main { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
      .card {
        max-width: 440px;
        width: 100%;
        text-align: center;
        padding: 40px 32px;
        border: 1px solid var(--arcora-border);
        border-radius: 24px;
        background: #fff;
      }
      .brand {
        font-size: 14px;
        font-weight: 600;
        color: var(--arcora-muted-fg);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 24px;
      }
      h1 { font-size: 28px; margin: 0 0 12px; line-height: 1.2; color: var(--arcora-slate); }
      p { color: var(--arcora-muted-fg); margin: 0 0 32px; font-size: 16px; }
      .pay-btn {
        padding: 16px 36px;
        border-radius: 56px;
        background: var(--arcora-slate);
        color: #fff;
        font-weight: 600;
        border: none;
        cursor: pointer;
        font-size: 16px;
        letter-spacing: 0.16px;
        transition: background 150ms ease;
      }
      .pay-btn:hover:not(:disabled) { background: var(--arcora-blue); }
      .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .status {
        margin-top: 28px;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 14px;
        text-align: left;
      }
      .status.success { background: #ecfdf5; color: #047857; }
      .status.warn    { background: #fef3c7; color: #92400e; }
      .status.error   { background: #fee2e2; color: #991b1b; }
      .status.error code { display: block; margin-top: 6px; font-size: 12px; word-break: break-all; }
      .banner {
        margin: 0 0 24px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.45;
        text-align: left;
      }
      .banner strong { display: block; margin-bottom: 2px; font-size: 13px; }
      .banner.warn   { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
      .banner.danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
      .footer {
        margin-top: 40px;
        font-size: 13px;
      }
      .footer a {
        color: var(--arcora-blue);
        text-decoration: none;
        font-weight: 500;
      }
      .footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
